plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.uhf'
    compileSdk 34

    defaultConfig {
        applicationId "com.mira.jewelry.enterprise"
        minSdk 26
        targetSdk 34
        versionCode 5              // ✅ زيادة الإصدار
        versionName "1.5.0"        // ✅ الإصدار الجديد مع المحاسبة
        
        buildConfigField "boolean", "Test", "false"
        buildConfigField "boolean", "ENABLE_LOGGING", "false"
        
        // ✅ تحديث عنوان الـ API
        buildConfigField "String", "DEFAULT_SERVER_URL", '"https://sa.mirabarcode.com/wp-json"'
        buildConfigField "String", "API_NAMESPACE", '"mira/v2"'
        buildConfigField "String", "API_BASE_URL", '"https://sa.mirabarcode.com/wp-json/mira/v2/"'
        
        // ✅ إعدادات المحاسبة
        buildConfigField "String", "DEFAULT_CURRENCY", '"YER"'
        buildConfigField "String", "DEFAULT_USD_RATE", '"535.0"'
        buildConfigField "String", "DEFAULT_SAR_RATE", '"142.5"'
        buildConfigField "int", "DEFAULT_BRANCH_ID", "1"
        
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        
        vectorDrawables {
            useSupportLibrary true
        }
        
        resConfigs "en", "ar"
        
        // ✅ Chainway SDK يدعم arm64-v8a و armeabi-v7a (وليس armeabi)
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
        
        // ✅ multidex للتطبيق الكبير (RFID + CameraX + MLKit + Room + Retrofit + ...)
        multiDexEnabled true
    }

    signingConfigs {
        debug {
            storeFile file("uhf-serial_release.jks")
            storePassword "123456"
            keyPassword "123456"
            keyAlias "uhf-serial-key"
        }
        release {
            storeFile file("uhf-serial_release.jks")
            storePassword "123456"
            keyPassword "123456"
            keyAlias "uhf-serial-key"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.release
            
            // ✅ مؤقتاً معطّلة — سنُفعّلها بعد نجاح الاختبار على C72
            minifyEnabled false
            shrinkResources false
            
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            
            // ✅ تفعيل اللوجات مؤقتاً للتشخيص الأولي
            buildConfigField "boolean", "ENABLE_LOGGING", "true"
            
            zipAlignEnabled true
            debuggable false
        }
        
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
            
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            
            buildConfigField "boolean", "ENABLE_LOGGING", "true"
        }
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    lintOptions {
        checkReleaseBuilds false
        abortOnError false
        warningsAsErrors false
        disable 'MissingTranslation', 'ExtraTranslation'
    }
    
    packagingOptions {
        resources {
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                '/META-INF/DEPENDENCIES',
                '/META-INF/LICENSE*',
                '/META-INF/NOTICE*',
                '/META-INF/INDEX.LIST',
                '/META-INF/versions/**',
                'META-INF/*.version',
                'META-INF/proguard/*',
                'META-INF/*.kotlin_module',     // ✅ جديد — Retrofit/Kotlin
                '/*.properties',
                'fabric/*',
                'com/google/thirdparty/publicsuffix/*',
                'DebugProbesKt.bin',            // ✅ جديد — Coroutines
                'kotlin-tooling-metadata.json'  // ✅ جديد
            ]
        }
        
        // ✅ مهم: Chainway native libs تحتاج legacy packaging
        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/arm64-v8a/*.so', '**/armeabi-v7a/*.so']
        }
    }
}

dependencies {
    // ==================== AndroidX Core & UI ====================
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.vectordrawable:vectordrawable:1.2.0'  // ✅ جديد
    
    // ✅ multidex
    implementation 'androidx.multidex:multidex:2.0.1'
    
    // ✅ RecyclerView + CardView (للنظام المحاسبي)
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'  // ✅ جديد
    
    // ==================== Brotli decoder ====================
    implementation 'org.brotli:dec:0.1.2'
    
    // ==================== Lifecycle ====================
    implementation "androidx.lifecycle:lifecycle-process:2.7.0"
    implementation "androidx.lifecycle:lifecycle-common-java8:2.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime:2.7.0"
    // ✅ جديد — MVVM للنظام المحاسبي
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.7.0"
    implementation "androidx.lifecycle:lifecycle-livedata:2.7.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:2.7.0"
    
    // ==================== Fragment ====================
    implementation 'androidx.fragment:fragment:1.6.2'
    
    // ==================== Biometric ====================
    implementation 'androidx.biometric:biometric:1.1.0'
    
    // ==================== 🔴 Chainway SDK (DeviceAPI_ver20251103_release.aar) ====================
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])
    
    // ==================== CameraX ====================
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    
    // ==================== Barcode Scanning ====================
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    
    // ==================== Networking — Retrofit + OkHttp (لنظام المحاسبة) ====================
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'  // ✅ جديد
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'
    implementation 'com.google.code.gson:gson:2.10.1'
    
    // ==================== Charts ====================
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    
    // ==================== Glide ====================
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    
    // ==================== Room ====================
    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"
    
    // ==================== Security ====================
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
    
    // ==================== Coroutines ====================
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'  // ✅ جديد
    
    // ==================== WorkManager (مزامنة دورية) ====================
    implementation 'androidx.work:work-runtime:2.9.0'  // ✅ جديد
    
    // ==================== WorkManager (مزامنة دورية) ====================
    implementation 'androidx.work:work-runtime:2.9.0'  // ✅ جديد
    
    // ==================== Desugaring ====================
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
    
    // ==================== Testing ====================
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.10.0'  // ✅ جديد
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.runner:1.6.2'
    androidTestImplementation 'androidx.test.rules:1.6.1'
}

// ==================== تخصيص اسم APK ====================
android.applicationVariants.all { variant ->
    variant.outputs.all { output ->
        def versionName = variant.versionName
        def buildType = variant.buildType.name
        
        def apkName = "MIRA_ID_Smart_Jewelry_Tag_v${versionName}_${buildType}.apk"
        
        output.outputFileName = apkName
    }
}
