plugins {
    id 'com.android.application'
}

android {
    namespace 'com.example.uhf'
    compileSdk 34

    defaultConfig {
        applicationId "com.mira.jewelry.enterprise"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "1.5.0"

        buildConfigField "boolean", "Test", "false"
        buildConfigField "boolean", "ENABLE_LOGGING", "false"

        buildConfigField "String", "DEFAULT_SERVER_URL", '"https://id.ibreg.org/wp-json"'
        buildConfigField "String", "API_NAMESPACE", '"mira/v2"'
        buildConfigField "String", "API_BASE_URL", '"https://id.ibreg.org/wp-json/mira/v2/"'
        buildConfigField "boolean", "ALLOW_SIMULATOR", "true"
        buildConfigField "String", "DEFAULT_CURRENCY", '"YER"'
        buildConfigField "String", "DEFAULT_USD_RATE", '"535.0"'
        buildConfigField "String", "DEFAULT_SAR_RATE", '"142.5"'
        buildConfigField "int", "DEFAULT_BRANCH_ID", "1"

        vectorDrawables {
            useSupportLibrary true
        }

        resConfigs "en", "ar"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        multiDexEnabled true
    }

    // ✅ حل مشكلة الـ keystore على CI
    def keystoreFile = file("uhf-serial_release.jks")
    def hasKeystore = keystoreFile.exists()

    signingConfigs {
        if (hasKeystore) {
            release {
                storeFile keystoreFile
                storePassword System.getenv("KEYSTORE_PASSWORD") ?: "123456"
                keyPassword System.getenv("KEY_PASSWORD") ?: "123456"
                keyAlias System.getenv("KEY_ALIAS") ?: "uhf-serial-key"
            }
        }
    }

    buildTypes {
        release {
            if (hasKeystore) {
                signingConfig signingConfigs.release
            }

            minifyEnabled false
            shrinkResources false

            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            buildConfigField "boolean", "ENABLE_LOGGING", "true"

            zipAlignEnabled true
            debuggable false
        }

        // ❌ تم حذف debug buildType لتسريع البناء
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    // ✅ استخدام lint بدلاً من lintOptions (AGP 8+)
    lint {
        checkReleaseBuilds false
        abortOnError false
        warningsAsErrors false
        disable 'MissingTranslation', 'ExtraTranslation'
    }

    packagingOptions {
        resources {
            excludes += [
                '/META-INF/{AL2.0,LGPL2.1}',
                '/META-INF/DEPENDENCIES',
                '/META-INF/LICENSE*',
                '/META-INF/NOTICE*',
                '/META-INF/INDEX.LIST',
                '/META-INF/versions/**',
                'META-INF/*.version',
                'META-INF/proguard/*',
                'META-INF/*.kotlin_module',
                '/*.properties',
                'fabric/*',
                'com/google/thirdparty/publicsuffix/*',
                'DebugProbesKt.bin',
                'kotlin-tooling-metadata.json'
            ]
        }

        jniLibs {
            useLegacyPackaging = true
            keepDebugSymbols += ['**/arm64-v8a/*.so', '**/armeabi-v7a/*.so']
        }
    }
}

dependencies {
    // ==================== AndroidX Core & UI ====================
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.gridlayout:gridlayout:1.0.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'androidx.vectordrawable:vectordrawable:1.2.0'

    implementation 'androidx.multidex:multidex:2.0.1'

    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.dynamicanimation:dynamicanimation:1.0.0'

    // ==================== Brotli ====================
    implementation 'org.brotli:dec:0.1.2'

    // ==================== Lifecycle ====================
    implementation "androidx.lifecycle:lifecycle-process:2.7.0"
    implementation "androidx.lifecycle:lifecycle-common-java8:2.7.0"
    implementation "androidx.lifecycle:lifecycle-runtime:2.7.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel:2.7.0"
    implementation "androidx.lifecycle:lifecycle-livedata:2.7.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:2.7.0"

    // ==================== Fragment ====================
    implementation 'androidx.fragment:fragment:1.6.2'

    // ==================== Biometric ====================
    implementation 'androidx.biometric:biometric:1.1.0'

    // ==================== Chainway SDK ====================
    implementation fileTree(dir: 'libs', include: ['*.aar', '*.jar'])

    // ==================== CameraX ====================
    def camerax_version = "1.3.4"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"

    // ==================== Barcode ====================
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'

    // ==================== Networking ====================
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.11.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.11.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    // ==================== Charts ====================
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    // ==================== Glide ====================
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // ==================== Room ====================
    implementation "androidx.room:room-runtime:2.6.1"
    annotationProcessor "androidx.room:room-compiler:2.6.1"

    // ==================== Security ====================
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // ==================== Coroutines ====================
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.8.1'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-core:1.8.1'

    // ==================== WorkManager ====================
    implementation 'androidx.work:work-runtime:2.9.0'

    // ==================== Desugaring ====================
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'

    // ❌ تم حذف testImplementation و androidTestImplementation
    // لأنها كانت تُستخدم فقط مع debug variant
}

// ==================== اسم APK مخصص ====================
android.applicationVariants.all { variant ->
    variant.outputs.all { output ->
        def versionName = variant.versionName
        def apkName = "MIRA_ID_Smart_Jewelry_Tag_v${versionName}.apk"
        output.outputFileName = apkName
    }
}
