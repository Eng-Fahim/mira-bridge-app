name: Build MIRA Bridge APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew :app:assembleDebug --stacktrace

    - name: Upload APK to Transfer.sh (Direct Download Link)
      run: |
        APK_PATH=$(find . -type f -name "*.apk" | head -n 1)
        echo "================================================="
        echo "Found APK at: $APK_PATH"
        echo "Direct Download Link:"
        curl --upload-file "$APK_PATH" https://transfer.sh/mira-bridge-debug.apk
        echo ""
        echo "================================================="
