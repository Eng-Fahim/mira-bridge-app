name: Cleanup Old Artifacts
on:
  workflow_dispatch:
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete Workflow Artifacts
        uses: geekyeggo/delete-artifact@v5
        with:
          # إذا أردت حذف جميع الـ Artifacts بلا استثناء لتفريغ المساحة فوراً:
          fail_no_artifact_match: false
          use_github_api_token: ${{ secrets.GITHUB_TOKEN }}
