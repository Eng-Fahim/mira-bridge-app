workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30

    environment:
      vars:
        PACKAGE_NAME: "com.mira.jewelry.enterprise"

    scripts:
      - name: Grant gradlew permission
        script: chmod +x gradlew

      - name: Build release APK
        script: |
          ./gradlew :app:assembleRelease

    artifacts:
      - app/build/outputs/apk/release/*.apk
